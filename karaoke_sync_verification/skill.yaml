  rationale: Long-form 4 shipped with karaoke text up to 24 seconds ahead of voice in segment 3 (224 to 337 seconds), for example text shown at 302 seconds and spoken at 326 seconds, while the raw Whisper timings were correct and the alignment step had misplaced a 35 second block. Frame QA on a few frames missed the drift, the user reported the text racing the voice on 15 Nov, and the fix requires rebuilding the karaoke file, re-rendering, re-uploading, and re-scheduling. Full karaoke is now the standing style from Ep 18 onward (assistant-msg-b616b4f1), so the same failure can repeat on every episode and long-form. Video-studio QA checks audio sync only in general terms and remotion-captions covers transcription and display, not a rendered-audio ground truth diff, so this narrow verification step fills the gap without replacing frame QA.
