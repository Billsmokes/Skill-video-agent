  rationale: The managed karaoke_sync_verification skill treats a Whisper re-transcription of the rendered audio as ground truth. On LF5 that checker gave contradictory fail results on the same long music-bedded timeline, while cross-correlation of the clean voice files against the rendered audio gave zero offset on all six scenes and was recorded as the authoritative check. Without this distinction the next long-form risks a needless rebuild and re-render on a Whisper false positive, or a real drift missed while chasing one. This update adds cross-correlation as the authoritative check for long music-bedded audio and keeps the Whisper diff for Shorts and clean voice audio.
